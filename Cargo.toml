# The public cursio-sdk repository's workspace. Generated by `cargo xtask
# sdk-mirror` in Cursio from crates/sdk/mirror/; edit it there, not here.

[workspace]
resolver = "2"
members = ["crates/app-protocol", "crates/sdk"]

[workspace.package]
edition = "2021"
repository = "https://github.com/THEROER/cursio-sdk"

[workspace.dependencies]
cursio-app-protocol = { path = "crates/app-protocol", version = "0.7.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
libc = "0.2"
# What the client uses, and no more: an application linking it should not
# compile the rest of Tokio for it.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
# The `tracing` feature's layer: `Layer` and the registry it plugs into, not
# the formatters or filters an application already chose for itself.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
