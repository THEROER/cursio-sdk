[package]
name = "cursio-app-protocol"
version = "0.3.1"
edition.workspace = true
# Not the workspace's GPL: applications link `cursio-sdk`, which depends on
# this, and an Apache-2.0 program linking GPL code would itself become GPL.
# Nothing here is taken from the GPL crates; see docs/app-sdk-design.md.
license = "MIT OR Apache-2.0"
# The public mirror it is published from (`cargo xtask sdk-mirror`), not
# Cursio's own repository.
repository = "https://github.com/THEROER/cursio-sdk"
description = "What an application and the Cursio node on its machine say to each other"
readme = "README.md"
keywords = ["cursio", "mesh", "ipc", "devtools"]
categories = ["development-tools", "network-programming"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
